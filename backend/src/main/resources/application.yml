# Configuración común. Los datos de la base de datos están en los perfiles
# application-local.yml (XAMPP) y application-demo.yml (Render).
server:
  # Render indica el puerto en la variable PORT. Si no existe, se usa el 8080.
  port: ${PORT:8080}

spring:
  application:
    name: papeleria-matrix
  profiles:
    # Si no se indica otro perfil, corre en modo local con XAMPP.
    default: local

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  # Clave que se exige en la cabecera X-API-Key para crear, modificar y borrar.
  # En Render se genera sola, con la variable API_KEY definida en render.yaml.
  api-key: ${API_KEY:clave-de-prueba}
