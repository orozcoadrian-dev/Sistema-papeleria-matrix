# Modo demo: es el que corre en Render. Usa una base de datos H2 dentro del contenedor.
# Las tablas se crean desde las entidades y se cargan los datos de ejemplo de demo/datos-demo.sql.
# Todo se pierde cuando el servicio se reinicia.
spring:
  datasource:
    url: jdbc:h2:mem:papeleria;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    # Los datos de ejemplo se cargan después de que Hibernate crea las tablas.
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      mode: always
      data-locations: classpath:demo/datos-demo.sql
