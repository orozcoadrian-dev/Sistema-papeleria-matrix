# Modo demo: es el que corre en Render. Usa una base de datos H2 dentro del contenedor.
# Los datos son de ejemplo y se pierden cuando el servicio se reinicia.
spring:
  datasource:
    url: jdbc:h2:mem:papeleria;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
