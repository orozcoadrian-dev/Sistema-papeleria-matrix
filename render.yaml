# Configuración de Render (Blueprint). En Render: New, Blueprint, y se elige este repositorio.
services:
  - type: web
    name: papeleria-matrix-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    # Render despliega solo cuando pasan las revisiones de GitHub Actions (.github/workflows/ci.yml).
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      # Render inventa la clave al crear el servicio. Se consulta en Environment y se usa en Postman.
      - key: API_KEY
        generateValue: true
