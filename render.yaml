# Configuración de Render (Blueprint). En Render: New, Blueprint, y se elige este repositorio.
services:
  - type: web
    name: papeleria-matrix-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    # Render despliega solo cuando pasan las revisiones de GitHub Actions (.github/workflows/ci.yml).
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      # Render inventa la clave al crear el servicio. Se consulta en Environment y se usa en Postman.
      - key: API_KEY
        generateValue: true
      # Direcciones desde las que la página puede consultar la API: la página publicada en Render.
      - key: CORS_ORIGENES
        value: https://papeleria-matrix-web.onrender.com
      # Opcionales, para enviar los registros de venta por correo. Se escriben en Environment, nunca aquí.
      - key: CORREO_CLAVE
        sync: false
      - key: CORREO_REMITENTE
        sync: false

  # La página (pública y pantallas internas). Son archivos fijos, no hay que compilar nada.
  - type: web
    name: papeleria-matrix-web
    runtime: static
    buildCommand: echo "La página no necesita compilación"
    staticPublishPath: ./frontend
    autoDeployTrigger: checksPass
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
